services:
  bookworm:
    build: .
    volumes:
      - bookworm-data:/data
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      INVITE_CODE: ${INVITE_CODE:-}
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  bookworm-data:
